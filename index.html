<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clothing Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 280px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
        .price {
            font-size: 18px;
            color: #e44d26;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Clothing Store</h1>
        <p>ලස්සනම ඇඳුම් පහසුවෙන්ම මිලදී ගන්න</p>
    </header>

    <div class="container">
        
        <!-- පළමු ඇඳුම (T-Shirt 1) -->
       <div class="product-card">
    <img src="20251117_211228.jpg" alt="T-Shirt 1">
    <h3>Casual White T-Shirt</h3>
    <p class="price">Rs. 1,800</p>
    <button class="btn-whatsapp" onclick="sendOrder('Casual White T-Shirt', 'Rs. 1,800')">Order via WhatsApp</button>
</div>

        <!-- දෙවන ඇඳුම (Product 2) -->
        <div class="product-card">
    <img src="20251117_211324.jpg" alt="Dress 2">
    <h3>Casual Denim Jacket</h3>
    <p class="price">Rs. 4,200</p>
    <button class="btn-whatsapp" onclick="sendOrder('Casual Denim Jacket', 'Rs. 4,200')">Order via WhatsApp</button>
</div>


        <!-- තුන්වන ඇඳුම (Product 3) -->
        <div class="product-card">
            <img src="https://unsplash.com" alt="Dress 3">
            <h3>Stylish Sneakers</h3>
            <p class="price">Rs. 5,500</p>
            <button class="btn-whatsapp" onclick="sendOrder('Stylish Sneakers', 'Rs. 5,500')">Order via WhatsApp</button>
        </div>

    </div>

    <script>
        function sendOrder(productName, price) {
            var phoneNumber = "94771234567"; // ඔයාගේ අංකය පසුව දාන්න
            var message = "Hello! I want to buy this item:\n\n" +
                          "👕 Product: " + productName + "\n" +
                          "💰 Price: " + price + "\n\n" +
                          "Please send me the delivery details.";
            var whatsappURL = "https://wa.me" + phoneNumber + "?text=" + encodeURIComponent(message);
            window.open(whatsappURL, '_blank');
        }
    </script>

</body>
</html>
