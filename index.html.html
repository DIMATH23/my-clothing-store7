<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimath Clothing Store</title>
    <style>
        /* මූලික සැකසුම් */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Header කොටස සහ එහි Animation එක */
        header {
            background: linear-gradient(135deg, #111111, #333333);
            color: white;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInHeader 1.2s ease-in-out;
        }

        @keyframes fadeInHeader {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        header p {
            margin: 10px 0 0 0;
            font-size: 1.1rem;
            color: #ccc;
        }

        /* ඇඳුම් කාඩ් තියෙන ප්‍රධාන කොටස */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 0 20px;
        }

        /* ඇඳුම් කාඩ් එක සහ එය උඩට මවුස් එක ගෙනිද්දී සිදුවන Animation එක (Hover Effect) */
        .product-card {
            background: white;
            border-radius: 16px;
            width: 290px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            opacity: 0;
            animation: fadeInUpCards 0.8s ease forwards;
        }

        /* කාඩ් එක උඩට මවුස් එක යද්දී පොඩ්ඩක් ඉස්සී ලස්සන වීම */
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        @keyframes fadeInUpCards {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* පින්තූර සැකසුම් */
        .product-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.02);
        }

        .product-title {
            font-size: 1.2rem;
            margin: 15px 0 5px 0;
            font-weight: 600;
        }

        .price {
            font-size: 20px;
            color: #ff4757;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }

        /* Size/Color තේරීම් කොටස */
        .options {
            margin: 15px 0;
            text-align: left;
        }

        .options label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            display: block;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .options select {
            width: 100%;
            padding: 8px 12px;
            margin-top: 4px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .options select:focus {
            border-color: #25D366;
        }

        /* WhatsApp Button එක සහ එහි Animation එක */
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-sizing: border-box;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
            transform: scale(1.02);
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Dimath Clothing Store</h1>
        <p>ලස්සනම ඇඳුම් නවීන විලාසිතාවෙන් පහසුවෙන්ම මිලදී ගන්න</p>
    </header>

    <div class="container">
        
        <!-- පළමු ඇඳුම -->
        <div class="product-card" style="animation-delay: 0.2s;">
            <img src="20251117_211228.jpg" alt="Dress 1">
            <div class="product-title">Casual White T-Shirt</div>
            <div class="price">Rs. 1,800</div>
            
            <div class="options">
                <label>Size:</label>
                <select id="size1">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                
                <label>Color:</label>
                <select id="color1">
                    <option value="White">White</option>
                    <option value="Black">Black</option>
                    <option value="Blue">Blue</option>
                </select>
            </div>
            
            <button class="btn-whatsapp" onclick="sendOrder('Casual White T-Shirt', 'Rs. 1,800', 'size1', 'color1')">Order via WhatsApp</button>
        </div>

        <!-- දෙවන ඇඳුම -->
        <div class="product-card" style="animation-delay: 0.4s;">
            <img src="20251117_211324.jpg" alt="Dress 2">
            <div class="product-title">Casual Denim Jacket</div>
            <div class="price">Rs. 4,200</div>
            
            <div class="options">
                <label>Size:</label>
                <select id="size2">
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                
                <label>Color:</label>
                <select id="color2">
                    <option value="Blue">Blue</option>
                    <option value="Black">Black</option>
                </select>
            </div>
            
            <button class="btn-whatsapp" onclick="sendOrder('Casual Denim Jacket', 'Rs. 4,200', 'size2', 'color2')">Order via WhatsApp</button>
        </div>

    </div>

    <script>
        function sendOrder(productName, price, sizeId, colorId) {
            var phoneNumber = "94760288504"; 
            
            var selectedSize = document.getElementById(sizeId).value;
            var selectedColor = document.getElementById(colorId).value;
            
            var message = "Hello! I want to buy this item:\n\n" +
                          "👕 Product: " + productName + "\n" +
                          "📐 Size: " + selectedSize + "\n" +
                          "🎨 Color: " + selectedColor + "\n" +
                          "💰 Price: " + price + "\n\n" +
                          "Please send me the delivery details.";
            
            var whatsappURL = "https://wa.me" + phoneNumber + "?text=" + encodeURIComponent(message);
            window.location.href = whatsappURL;
        }
    </script>

</body>
</html>
